<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR.js A-Frame Solar Quiz - X3</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="../css/styleVH.css" />

</head>
<body>
  
  <button id="btnClose">✖</button>

  <div class="quiz-modal" id="quizModal">
    <div class="quiz-content">
      <h1 id="quizPlanetName"></h1>
      <h2 id="quizQuestion"></h2>
      <div id="quizAnswers"></div>
    </div>
  </div>

  <div class="victory-modal" id="victoryModal">
    <div class="victory-content">
      <span class="victory-icon">🏆</span>
      <h1 class="victory-title">Parabéns!</h1>
      <p class="victory-score-label">Pontuação Final:</p>
      <span class="victory-score-value" id="victoryScore">0</span>
      <button class="btn-finish" onclick="document.getElementById('btnClose').click()">
        VOLTAR AO MENU
      </button>
    </div>
  </div>

  <div id="info-panel" style="display: none;">
    <span id="info-text"></span><br><br>
    <button onclick="document.getElementById('info-panel').style.display='none'">
      Fechar
    </button>
  </div>

  <div id="distanceDisplay">Procurando planetas...</div>

  <div id="scoreDisplay">Pontuação: 0</div>
  <div id="gpsDebug">GPS: Aguardando...</div>

  <a-scene vr-mode-ui="enabled: false" 
         arjs="sourceType: webcam; 
               videoTexture: true; 
               debugUIEnabled: false;
               sourceWidth: 1280; 
               sourceHeight: 720; 
               displayWidth: 1280; 
               displayHeight: 720;"
         cursor="rayOrigin: mouse"
         raycaster="objects: [proximity-check], a-sphere">
    <a-camera gps-new-camera="gpsMinDistance: 0" planet-distance-tracker rotation-reader></a-camera>
  </a-scene>

  
  <script src="../js/utils.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/componentsV2.js"></script>
  <script src="../js/initializerX3.js"></script>

  <script>
    document.getElementById('btnClose').addEventListener('click', function() {
      // Verifica se está dentro do telemóvel (React Native)
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage("voltar_para_o_menu");
      } else {
        window.location.href = "../index.html";
      }
    });
  </script>
</body>
</html>
